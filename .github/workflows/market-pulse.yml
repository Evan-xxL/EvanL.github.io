name: Market Pulse

on:
  schedule:
    # 21:35 UTC on weekdays = 4:35 pm Eastern in winter, 5:35 pm in summer (after the 4 pm close)
    - cron: "35 21 * * 1-5"
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  repository_dispatch:        # trigger from any app with a POST to the GitHub API
    types: [market-brief]

permissions:
  contents: write             # lets the job commit the new data files
  pages: write                # lets the job ask GitHub Pages to rebuild

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull quotes and news, post the brief
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/market-pulse/
        run: python market-pulse/scripts/market_pulse.py

      - name: Save the new data to the site
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse/data
          git diff --staged --quiet || git commit -m "Market Pulse: data for $(date -u +%Y-%m-%d)"
          git push

      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the change on its own"
